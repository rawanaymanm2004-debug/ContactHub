<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contacthub</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <div class="left-nav d-flex align-items-center gap-2">
          <div
            class="nav-icon d-flex align-items-center justify-content-center rounded-3"
          >
            <i class="fa-solid fa-address-book fa-lg" style="color: white"></i>
          </div>
          <div class="nav-title">
            <h1 class="text-black fs-3 fw-bold m-0">Contact<span>Hub</span></h1>
            <p class="m-0 fw-medium">Smart Contact Manager</p>
          </div>
        </div>
        <div
          class="right-nav d-flex align-items-center justify-content-end gap-2"
        >
          <button
            id="addContact"
            type="button"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
            class="btn-solid text-white fw-semibold border-0"
          >
            <i class="fa-solid fa-plus fa-2xs" style="color: white"></i>
            Add Contact
          </button>

          <button class="right-icon d-none d-md-block">
            <i class="fa-solid fa-bell fa-sm"></i>
          </button>
          <button class="right-icon d-none d-md-block">
            <i class="fa-solid fa-gear fa-sm"></i>
          </button>

          <div class="avatar">
            <img
              src="imgs/imgi_1_avatar-4.jpg"
              class="w-100 object-fit-cover"
              alt="avatar"
            />
          </div>
        </div>
      </div>
    </nav>
    <main class="py-4 px-md-3 d-md-flex justify-content-md-center">
      <div class="container m-0">
        <div class="row g-3">
          <div class="col-6 col-md-4">
            <div
              class="card total shadow p-3 bg-white rounded-4 d-flex flex-row gap-2 align-items-center"
            >
              <div
                class="card-icon rounded-3 d-flex align-items-center justify-content-center"
              >
                <i class="fa-solid fa-users" style="color: white"></i>
              </div>
              <div class="card-content">
                <span class="fw-semibold text-secondary">TOTAL</span>
                <p id="totalCount" class="fw-bold text-black">0</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div
              class="card favorite shadow p-3 bg-white rounded-4 d-flex flex-row gap-2 align-items-center"
            >
              <div
                class="card-icon rounded-3 d-flex align-items-center justify-content-center"
              >
                <i class="fa-solid fa-star" style="color: white"></i>
              </div>
              <div class="card-content">
                <span class="fw-semibold text-secondary text-uppercase"
                  >Favorites</span
                >
                <p id="favCount" class="fw-bold text-black">0</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4">
            <div
              class="card emergency shadow p-3 bg-white rounded-4 d-flex flex-row gap-2 align-items-center"
            >
              <div
                class="card-icon rounded-3 d-flex align-items-center justify-content-center"
              >
                <i class="fa-solid fa-heart-pulse" style="color: white"></i>
              </div>
              <div class="card-content">
                <span class="fw-semibold text-secondary text-uppercase"
                  >Emergency</span
                >
                <p id="emgCount" class="fw-bold text-black">0</p>
              </div>
            </div>
          </div>
          <section>
            <div class="row g-4">
              <div class="col-12 col-lg-9">
                <h2 class="fs-4 fw-bold text-black">All Contacts</h2>
                <p class="fs-6 fw-normal text-secondary">
                  Manage and organize your
                  <span id="contactsText">0 </span>contacts
                </p>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="fa-solid fa-magnifying-glass text-secondary"></i>
                  </span>
                  <input
                    type="search"
                    id="searchInput"
                    class="form-control border-start-0 py-3"
                    placeholder="Search by name, phone, or email..."
                    aria-label="Search contacts"
                  />
                </div>

                <div
                  id="emptyState"
                  class="py-5 d-flex flex-column align-items-center text-center"
                >
                  <div
                    class="contact-icon rounded-4 mt-4 d-flex align-items-center justify-content-center"
                  >
                    <i
                      class="fa-solid fa-address-book fa-2xl"
                      style="color: #d1d5dc"
                    ></i>
                  </div>
                  <div class="contact-details mb-4">
                    <p class="fs-6 fw-medium text-secondary m-0">
                      No contacts found
                    </p>
                    <span class="fw-normal mt-1"
                      >Click "Add Contact" to get started</span
                    >
                  </div>
                </div>
                <div id="contactList" class="row g-3 mt-3"></div>
              </div>

              <div class="col-12 col-lg-3">
                <div class="add-card rounded-4 shadow mb-3" id="favList">
                  <div
                    class="top-add-card add-favorite d-flex align-items-center gap-2"
                  >
                    <div
                      class="add-favorite-icon rounded-3 d-flex align-items-center justify-content-center"
                    >
                      <i class="fa-solid fa-star" style="color: white"></i>
                    </div>
                    <div class="add-favorite-details">
                      <h2 class="text-black fw-semibold m-0">Favorites</h2>
                      <p class="text-secondary fw-normal m-0">Quick access</p>
                    </div>
                  </div>
                  <div id="favItems" class="bottom-add-card text-center">
                    <p class="py-5 fw-semibold">No favorites yet</p>
                  </div>
                </div>

                <div class="add-card rounded-4 shadow" id="emgList">
                  <div
                    class="top-add-card add-emergency d-flex align-items-center gap-2"
                  >
                    <div
                      class="add-emergency-icon rounded-3 d-flex align-items-center justify-content-center"
                    >
                      <i
                        class="fa-solid fa-heart-pulse"
                        style="color: white"
                      ></i>
                    </div>
                    <div class="add-emergency-details">
                      <h2 class="text-black fw-semibold m-0">Emergency</h2>
                      <p class="text-secondary fw-normal m-0">
                        Urgent contacts
                      </p>
                    </div>
                  </div>
                  <div id="emgItems" class="bottom-add-card text-center">
                    <p class="py-5 fw-semibold">No emergency contacts</p>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- Modal -->
    <div
      class="modal fade"
      id="staticBackdrop"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">
              Add New Contact
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="contact-photo d-flex flex-column align-items-center">
              <div
                id="photoPreview"
                class="contact-img-icon rounded-circle d-flex align-items-center justify-content-center overflow-hidden"
              >
                <i class="fa-solid fa-user fa-2xl" style="color: white"></i>
              </div>
              <input
                type="file"
                id="photoInput"
                accept="image/*"
                class="d-none"
              />
              <button
                id="changePhotoBtn"
                type="button"
                class="border-0 rounded-3 py-2 px-3 fw-medium d-flex gap-2 align-items-center mt-3"
              >
                <i class="fa-solid fa-camera fa-sm" style="color: #6a7282"></i>
                Change Photo
              </button>
            </div>
            <form id="contactForm" novalidate>
              <div class="mb-3">
                <label for="fullName" class="form-label fw-medium"
                  >Full Name
                  <i class="fa-solid fa-asterisk fa-2xs" style="color: red"></i
                ></label>
                <input
                  type="text"
                  class="form-control px-3 rounded-4"
                  id="fullName"
                  placeholder="Enter full name"
                />
              </div>
              <div class="mb-3">
                <label for="phoneNumber" class="form-label fw-medium"
                  >Phone Number
                  <i class="fa-solid fa-asterisk fa-2xs" style="color: red"></i
                ></label>
                <input
                  type="tel"
                  class="form-control px-3 rounded-4"
                  id="phoneNumber"
                  placeholder="e.g., 01012345678"
                />
              </div>
              <div class="mb-3">
                <label for="emailAddress" class="form-label fw-medium"
                  >Email Address</label
                >
                <input
                  type="email"
                  class="form-control px-3 rounded-4"
                  id="emailAddress"
                  placeholder="name@example.com"
                />
              </div>
              <div class="mb-3">
                <label for="Address" class="form-label fw-medium"
                  >Address</label
                >
                <input
                  type="text"
                  class="form-control px-3 rounded-4"
                  id="Address"
                  placeholder="Enter address"
                />
              </div>
              <div class="mb-3">
                <label for="group" class="form-label fw-medium"> Group </label>

                <select class="form-select rounded-4" id="group" name="group">
                  <option value="" selected disabled>Select a group</option>
                  <option value="family">Family</option>
                  <option value="friends">Friends</option>
                  <option value="work">Work</option>
                  <option value="school">School</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="Notes" class="form-label fw-medium">Notes</label>
                <textarea
                  class="form-control rounded-4"
                  id="Notes"
                  rows="2"
                  placeholder="Add notes about this contact"
                ></textarea>
              </div>
              <div class="d-flex gap-3 flex-row justify-content-start">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="isFav"
                  />
                  <label class="form-check-label" for="isFav">
                    <i class="fa-solid fa-star" style="color: #ffb900"></i>
                    Favorite
                  </label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="isEmg"
                  />
                  <label class="form-check-label" for="isEmg">
                    <i
                      class="fa-solid fa-heart-pulse"
                      style="color: #ff2056"
                    ></i>
                    Emergency
                  </label>
                </div>
              </div>
              <div class="mt-3 d-md-flex gap-3">
                <button
                  type="submit"
                  class="btn save-btn mb-3 d-flex gap-2 align-items-center justify-content-center fw-semibold col-12 col-md-6 text-white rounded-4"
                >
                  <i class="fa-solid fa-check" style="color: white"></i>
                  Save Contact
                </button>
                <button
                  data-bs-dismiss="modal"
                  type="button"
                  class="btn cancel-btn mb-3 fw-semibold col-12 col-md-6 rounded-4"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="main.js"></script>
  </body>
</html>
